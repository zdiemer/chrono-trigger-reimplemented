# Data deliberately sharing storage with executable code. These views belong
# to the asset pack; they must not turn executable regions into data in the
# matching disassembly. Locations only, never cartridge bytes.
[[view]]
name = "menu_scene_scroll_pattern"
type = "bytes"
at = "C0:0000"
end = "C0:01BF"
purpose = "448 bytes of irregular horizontal scroll for both background planes"

[[view]]
name = "menu_category_slot_place"
type = "bytes"
at = "C2:DE1D"
end = "C2:DE21"
purpose = "Four equipment slots and the shop's non-equipment item selector"

[[view]]
name = "battle_message_sound"
type = "bytes"
at = "D1:EE99"
end = "D1:EEA6"
purpose = "Battle message sounds including message 13's read into the following screen routine"
