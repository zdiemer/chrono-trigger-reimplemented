subsystem = "menu_object"
meaning = "How many of the palette's loaders and fades are working on each row of menu_object_palette: one counts its row up as it starts and down as it ends, and a fade that finds a newer one on its row gives the row up to it"
source = "game/menu/screen_objects.c ($C2:1DD4, $C2:1E38); cleared with the palette by $C2:1DB5"

