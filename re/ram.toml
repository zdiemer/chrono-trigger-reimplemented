# ==============================================================================
# The menus' sprite-object mode (menu_object)
# ==============================================================================
# Bank $C2 holds two modes. The menus proper draw records and windows; the mode
# started at $C2:0000 runs sprite objects, and the Epoch's two screens and the
# End of Time's gate are written as objects in it. The two reuse the same bytes
# -- the object slots cover the menus' records, and the object palette starts
# where the menus keep the caller's stack pointer -- so the second mode's
# variables carry this tag rather than `menu`. Both run on the `menu` page
# (D = $0000), so the mode's page cells are `menu_object_*` entries above.

[[var]]
name = "menu_object_palette"
addr = "7E:0920"
size = 512
subsystem = "menu_object"
meaning = "The sprite object mode's CGRAM image: the vblank handler sends all 512 bytes to colour 0 when the mode asks for it, and screens patch rows into it (the map view's sixteen map colours land at colour $80)"
source = "game/menu/display.c menu_upload_palette; the vblank DMA at $C2:01AD; game/menu/epoch.c, menu_epoch_build_map $C2:63DF"

[[var]]
name = "menu_object_slots"
addr = "7E:0B30"
count = 64
stride = 0x40
index = "the slot's address, which the mode keeps in menu_object_current"
subsystem = "menu_object"
meaning = "The mode's object slots, run in address order every frame by $C2:051D: a handler and the state it keeps between frames"
source = "game/menu/objects.c, menu_run_objects $C2:051D and menu_run_object_script $C2:0F63; game/menu/epoch.c (the screens are objects in these slots)"

  [[var.field]]
  name = "handler"
  offset = 0
  size = 2
  meaning = "The routine that runs the object each frame, called through JMP ($0050); zero for a free slot, and the handler returning carry set frees it"

  [[var.field]]
  name = "step"
  offset = 0x02
  meaning = "Which of the handler's steps runs next; the dispatch doubles it to index the handler's jump table"

  [[var.field]]
  name = "age"
  offset = 0x03
  size = 2
  meaning = "Frames the object has run, counted up after every frame its handler keeps the slot"

  [[var.field]]
  name = "script"
  offset = 0x07
  size = 3
  meaning = "Long pointer to the object's command script, advanced past each command $C2:0F63 runs"

  [[var.field]]
  name = "sprite_script"
  offset = 0x0B
  size = 3
  meaning = "Long pointer to the object's sprite script, advanced past each command $C2:0E1D runs"

  [[var.field]]
  name = "script_wait"
  offset = 0x0E
  meaning = "A command's countdown in frames: loaded from the command's operand when zero, then counted down until it is zero again"

  [[var.field]]
  name = "command_done"
  offset = 0x32
  size = 2
  meaning = "Cleared after every command the script runs, so the next command starts fresh"

[[var]]
name = "menu_object_sprite_script"
addr = "7E:0052"
size = 3
page = "menu"
subsystem = "menu_object"
meaning = "Long pointer to the running object's sprite script, taken from its slot while $C2:0E1D runs it and put back after"
