name = "menu_line_effects"
addr = "7E:0D13"
page = "menu_vblank"
subsystem = "menu"
meaning = "Per-line effect slots to enable after the vblank uploads (bits 0-6); bit 7 asks the vblank for the block move set up at $7E:9694"
source = "game/menu/display.c, menu_nmi_work $C2:842A, menu_vblank_upload $C2:85D6; game/menu/save_screen.c, menu_load_row_table $C2:CFFB"

[[var]]
name = "menu_palette_changed"
addr = "7E:0D15"
subsystem = "menu"
meaning = "Nonzero when the working palette has changed and needs uploading; the upload clears it"
source = "game/menu/display.c, menu_upload_palette $C2:86A9; game/menu/save_screen.c, menu_draw_save_slot $C2:D36C"

[[var]]
name = "menu_record_origin_x"
addr = "7E:0D2E"
size = 2
subsystem = "menu"
meaning = "Added to each $1800 record's X position when its sprites are drawn"
source = "game/menu/objects.c, menu_draw_record_sprites $C2:F871"

[[var]]
name = "menu_record_origin_y"
addr = "7E:0D30"
subsystem = "menu"
meaning = "Added to each $1800 record's Y position when its sprites are drawn"
source = "game/menu/objects.c, menu_draw_record_sprites $C2:F871"

[[var]]
name = "menu_save_slot_in_use"
addr = "7E:0D49"
count = 4
index = "save slot"
subsystem = "menu"
meaning = "Nonzero for the save slots that hold a game, and for the fourth row while it can be chosen (the menus set it to $FF as they open; it is 0 while the load screen asks which game a New Game+ continues from); the load screen's cursor skips the others"
source = "game/menu/save_screen.c, menu_show_save_slot $C2:E743, menu_draw_save_slot $C2:D36C"

[[var]]
name = "menu_wait_frames"
addr = "7E:0D76"
subsystem = "menu"
meaning = "A frame countdown the vblank handler decrements until it reaches zero: the menus' sounds wait on it, three frames after one plays"
source = "game/menu/display.c, menu_nmi_work $C2:842A; game/menu/cursor.c, the menus' sounds $C2:EB03"

[[var]]
name = "menu_save_slot_era"
addr = "7E:0D77"
subsystem = "menu"
meaning = "The era whose label the load screen has loaded (the ROM's table at $FF:D296 gives a location's era), loaded again (through $C2:F90C) when a slot shows another"
source = "game/menu/save_screen.c, menu_draw_save_slot $C2:D36C"

[[var]]
name = "menu_save_header_taken"
addr = "7E:0D84"
size = 2
subsystem = "menu"
meaning = "Nonzero while the load screen uses the slot header's place for something else ($C2:E841 loads another graphic there and sets it, $C2:E6FC clears it): a slot is then drawn without its header and era label"
source = "game/menu/save_screen.c, menu_draw_save_slot $C2:D36C"

[[var]]
name = "menu_member_marked"
addr = "7E:0D5D"
subsystem = "menu"
meaning = "Set to 4 by $C2:A1EF when the character a status window shows ($7E:9A90's low bits) has reached the value the table at $7E:0D38 holds for it, which the window then draws in another palette ($C2:B02B); a save slot's drawing clears it"
source = "game/menu/save_screen.c, menu_draw_save_slot $C2:D36C"

[[var]]
name = "menu_load_destination"
addr = "7E:0DC5"
size = 2
subsystem = "menu"
meaning = "Where in bank $7E the menus' graphics loader ($C2:F90C) puts what it loads"
source = "game/menu/save_screen.c, menu_draw_save_slot $C2:D36C; $C2:F914"

