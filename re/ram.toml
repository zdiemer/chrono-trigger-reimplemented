# The RAM map: what the game's variables in work RAM mean. The code/data half
# of the knowledge base is re/hints.toml; this is the other half (docs/APPROACH.md,
# roadmap step 1). tools/ram_map.py validates it, generates game/ram.h from it
# and reports how much of what game/ touches it names (docs/DISASSEMBLY.md,
# "The RAM map").
#
# Everything here is knowledge about the console's work RAM -- where a variable
# lives, how wide it is, what it holds -- worked out from the code that uses
# it. Nothing here is ROM data: no initial values, no table contents.
#
#   [[page]]   name, d | instances, subsystem, meaning, source, [why]
#       A direct page: while the subsystem's code runs, D = d, so direct-page
#       offset o is $7E:(d + o). Or a page kind, whose code runs on more than
#       one page (the caller's, or one that walks along a table), with `why`
#       saying so and `instances` listing every page it runs on:
#           instances = [
#             { name = "scene", d = 0x0000 },                             # a named page
#             { name = "channel", base = 0x0A00, count = 2, stride = 0x100 },  # an array of pages
#           ]
#       Name an instance for where its cells are, not for the code that uses
#       it: two modes on the same D share one set of bytes, and the map rejects
#       two instances at one D. The instances are the D values measured at the
#       routines' entry over the movie library (ct_dev --page-report, which
#       tools/suite.py passes), plus any the code proves (a table's length), and
#       `source` says which. Variables on a page kind have an offset (dp) and no
#       address, and their accessors take the instance: an enum of the named
#       ones, an index for a lone array, or a {kind, index} pair for a mix
#       (docs/DISASSEMBLY.md, "The accessors").
#
#   [[var]]    name, addr | dp, [size], [count, stride, index], [rows, row_stride],
#              [page], [unchecked], [reuses], subsystem, meaning, source, [[var.field]]
#       A variable. addr is "7E:AAAA" or "7F:AAAA" (low RAM $0000-$1FFF is
#       $7E:0000-$1FFF, which banks $00-$3F mirror). size is the element's width
#       in bytes (default 1); an array has count elements `stride` bytes apart
#       (default: size) and `index` says what selects one ("object slot * 2",
#       "battle slot"). With rows and row_stride it is a table of rows: what
#       the rest describes is one row, `size` bytes a column, and the table
#       has `rows` of them `row_stride` bytes apart (other tables' rows may
#       lie between); its accessor takes a row and a column. With `page`, the
#       code reaches it through that direct page: give addr when the page's D
#       is fixed (the offset is derived), dp when the page is a page kind.
#       `unchecked` says why marked scaffolding reaches past the variable on
#       purpose (a `leave_stray_*` write the gate needs); it generates a second
#       pair of accessors, `<name>_unchecked`, without the bounds check the
#       others make (docs/DISASSEMBLY.md, "The accessors"). `reuses` names a
#       variable (or a list of them) of the same subsystem whose bytes this
#       one takes over at another time (the map's data, decompressed where the tiles' looks go
#       once it is unpacked), which the overlap check otherwise refuses.
#
#   [[var.field]]  name, offset, [size], meaning
#       A record: the element is `stride` bytes and the fields are at these
#       offsets in it. A record has no size of its own.
#
#   [[image]]  name, start, end, subsystem (a list), meaning, source
#       Work RAM that holds a program image the game copies or decompresses
#       there and runs, for the subsystems listed. Addresses in it are routines
#       and their data, which the ports name by their `// $BB:AAAA` origin, as
#       they do ROM addresses; the coverage count leaves them out.
#
#   [[not_ram]]  file (under game/), values = [...], why
#       Four- or six-digit literals in that file that the coverage count would
#       take for work RAM and are something else: VRAM word addresses, the
#       SPC700's memory, program counters, counts. The file's every use of the
#       value must be one. Only for the coverage count; the header has none.
#
#   [[offset]]   file, values = [...], bank = "7F", why
#       Four-digit literals in that file that are offsets the code adds to a
#       bank's base (0x7F0000u + 0x0980), so the count reads them as that
#       bank's addresses rather than $7E's.
#
# name is lower_snake_case and says what the thing is, not where it is; the
# header spells it RAM_<NAME>. subsystem is one of game/'s directories (core,
# data, event, field, menu, overworld, battle, scene, attract, warp), or `menu_object`, a second
# tag for game/menu/: bank $C2 holds two modes, the menus proper and the
# sprite-object mode at $C2:0000, and they reuse the same bytes, so one owner
# per subsystem would leave the second mode's nameless. The same bytes can be two
# entries when their subsystems differ: work RAM is reused from one game mode to
# the next. source says how the meaning was established: the port that uses it
# (file and `$BB:AAAA`), a doc, or a measurement.

# ==============================================================================
# Direct pages
# ==============================================================================
# Measured: every ported routine's D and data bank at entry, logged over the
# whole movie library (26 movies) with a probe in entry_applies
# (runtime/port/native.c, not committed), agree with the constant TCDs and
# PEA/PLD pairs in the disassembly listed with each page. The I/O pages the
# game also puts D on ($2100, $4200, $4300: M_DP_PPU, M_DP_DMA in
# runtime/port/machine.h) are registers, not work RAM, and are not here.

[[page]]
name = "field"
d = 0x0100
subsystem = "field"
meaning = "Field mode and the event engine's direct page"
source = "LDA #$0100 : TCD at $C0:001D, $C0:0082 and 12 more sites in $C0; every field_ and event_cmd_ port entered with D = $0100"

[[page]]
name = "field_layers"
d = 0x1D00
subsystem = "field"
meaning = "Field scratch page for the layer tile uploads and tile map unpacking"
source = "PHD : LDA #$1D00 : TCD ... PLD around calls at $C0:0339, $C0:0A56 and 18 more; field_upload_layer*, field_unpack_tile_maps, field_compute_layer_edges, field_update_layer_scroll entered with D = $1D00"

[[page]]
name = "field_window_shape"
d = 0x0300
subsystem = "field"
meaning = "Page the quadrilateral rasterizer for the field's window shapes runs on"
source = "PEA #$0300 : PLD in field_rasterize_quad $C3:0011 (game/field/window_shape.c); the same D as the decompressor's page, other cells"

[[page]]
name = "battle"
d = 0x0000
subsystem = "battle"
meaning = "Battle mode's direct page (with the data bank at $7E)"
source = "battle NMI sets D = 0 ($D1:E786, $D1:F4CA, $D1:FEA1); every battle_ port but the sprite drawers entered with D = $0000, DB = $7E"

[[page]]
name = "battle_sprites"
d = 0x1D00
subsystem = "battle"
meaning = "Battle scratch page for drawing object sprites"
source = "battle_copy_sprite_tiles, battle_draw_sprite_parts, battle_draw_shadow, battle_draw_object_underlays/overlays and battle_step_object_effect entered with D = $1D00"

[[page]]
name = "menu"
d = 0x0000
subsystem = "menu"
meaning = "Menu mode's direct page"
source = "LDA #$0000 : TCD at $C2:0168, PEA #$0000 : PLD at $C2:809B, $C2:81C9, $C2:8239, $C2:84EF; the menu_ ports entered with D = $0000"

[[page]]
name = "menu_vblank"
d = 0x0D00
subsystem = "menu"
meaning = "Menu page for the vblank uploads (palette and VRAM queue)"
source = "PEA #$0D00 : PLD at $C2:8429; menu_nmi_work, menu_vblank_upload, menu_upload_palette and menu_upload_vram_queue entered with D = $0D00"

[[page]]
name = "menu_glyph"
d = 0x0200
subsystem = "menu"
meaning = "Menu page for drawing font glyphs"
source = "LDA #$0200 : TCD at $C2:57E6 and $C2:582A; menu_draw_glyph entered with D = $0200"

[[page]]
name = "menu_record"
subsystem = "menu"
meaning = "A menu record's own page: the $40-byte records the task at $C2:F657 runs with the direct page on each, drawing their sprites"
source = "PEA #$1800/#$1980/#$19C0 : PLD at $C2:F3CF, $C2:CE2F, $C2:BA1F and more, and TCD after ADC #$0040 / SBC #$0040. Measured over the 26 movies (ct_dev --page-report): menu_draw_record_sprites ($C2:F871) entered with D on each of the eight records and nothing else ($1800 3744 calls, $1840 3497, $1880 3545, $18C0, $1900, $1940 and $1980 1868 each, $19C0 1259; all eight in menus-end-of-time); the opening ($C2:F3CA) marks a ninth, $1A00, empty, and the records' task ($C2:F657) passes it by"
why = "D walks a table of records, so an offset names a field of whichever record is current"
instances = [
  { name = "record", base = 0x1800, count = 9, stride = 0x40 },
]

[[page]]
name = "save_check"
subsystem = "menu"
meaning = "The page the save code's check of a slot ($FF:F9C4) runs on: the menus' own as they open, or the clock's ($0400), where the menus' services ($C2:8C36) look for a slot to go on from at power-on ($C2:8D6A)"
source = "PEA #$0400 : PLD at $C2:8C40 (the services, which call the check from $C2:8D6E); the menus' page at $C2:D16D (menu_read_save_slots). Measured over the library (ct_dev --page-report): the check entered with D = $0000 and $0400, nothing else"
why = "the check has no page of its own: it reads the slot from, and leaves its answer and the slot's place in, its caller's page"
instances = [
  { name = "menu", d = 0x0000 },
  { name = "clock", d = 0x0400 },
]

[[page]]
name = "sound"
d = 0x1E00
subsystem = "core"
meaning = "The sound driver interface's direct page"
source = "every sound_driver_ port but the entry points entered with D = $1E00"

[[page]]
name = "decompress"
d = 0x0300
subsystem = "data"
meaning = "The decompressor's direct page"
source = "LDA #$0300 : TCD at $C3:0562 (and $C3:0086, $C3:01EF); DP_BASE in game/data/decompress.c"

[[page]]
name = "palette_fade"
d = 0x0500
subsystem = "core"
meaning = "Page the palette fades and the animated tile uploads run on"
source = "palette_animate $FD:E39C sets D = $0500 (LDX #$0500 : PHX : PLD) for its handlers"

[[page]]
name = "scene"
d = 0x0000
subsystem = "scene"
meaning = "The scene engine's and scene program's direct page"
source = "LDA #$0000 : TCD at $C3:09EE; every scene_ port but scene_title_start_ripple (called from a script, on its channel's page) entered with D = $0000"

[[page]]
name = "scene_program"
subsystem = "scene"
meaning = "The page the scene program's shared routines run on: the scene's own, or, when a sequence script calls one, its channel's"
source = "Measured over the 26 movies (ct_dev --page-report): scene_multiply ($7E:31BF) entered with D = $0000 146235 times, $0A00 23842 (5412 of them in events-jetbike-race) and $0B00 1920 (endings-beyond-time); scene_divide ($7E:339F, 20115 calls), scene_divide_8_8 ($7E:32E2, 16225) and scene_multiply_signed ($C3:094C, 21120) only with $0000; the sequence interpreter ($C3:0AFF) on $0A00 61680 times and $0B00 18316, never another page. Two channels because the attract program has two (scene_channels); every instance is reached"
why = "the routines have no page of their own: they work on the cells of whichever page they are called on, the scene's own, or a sequence channel's (its record in scene_channels) when a channel's script calls a routine of the program"
instances = [
  { name = "own", d = 0x0000 },
  { name = "channel", base = 0x0A00, count = 2, stride = 0x100 },
]

[[page]]
name = "input"
d = 0x0000
subsystem = "core"
meaning = "The controller reader's direct page: it sets D = $0000 itself, whatever page its caller has"
source = "PEA #$0000 : PLD at $C2:84EC (input_read_joypad, game/core/input.c), which input_update ($C2:84D2) calls before input_map_buttons ($C2:8545). Measured over the 26 movies (ct_dev --page-report): input_read_joypad entered with eight different D's ($0000 453397 calls, $0100 195982, $0D00 35169, $1E00 1596, $2100 246, $1D00 173, $0300 102, $0500 1), all of which it replaces, and input_map_buttons with D = $0000 in all 651497 of its calls; the event engine's input conditions read the cells at $00F2 and $00F8 through the data bank (game/event/input.c)"

