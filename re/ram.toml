subsystem = "menu_object"
meaning = "The sprite-object mode's objects, run in slot order every frame by $C2:051D: a handler and the state it keeps between frames. Most run a command script; the Epoch's screens and a few effects have handlers of their own, which use the slot's later bytes as they need"
