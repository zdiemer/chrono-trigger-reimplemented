# ==============================================================================
# The time warp
# ==============================================================================
# The tunnel the party falls through between eras (game/warp/), a mode of its
# own that the field's event command $FF starts with $80-$83 and that hands back
# to the field's entry. Its code runs on the palette fades' page (D = $0500), and
# it builds its picture over bank $7F's first half, keeping the story flags aside.

[[var]]
name = "warp_zero"
addr = "7E:0508"
size = 2
subsystem = "warp"
meaning = "A zero the warp keeps on its page and starts its indexes from: the original's routines index from it, and the ports' guards take only a page that holds it (game/warp/warp.c warp_on_its_page)"
source = "game/warp/warp.c warp_set_up $FD:DBB3"

[[var]]
name = "warp_work"
addr = "7E:050A"
count = 16
index = "byte of the work area"
subsystem = "warp"
meaning = "The warp's working cells, which its routines take in turn: the circle's builder (its radius, the area left and the run down its edge, the lines of its lower half), the light's rays (a ray's steps, place and band, a pixel's colour and row), the plane's scale (a product and a quotient) and the palette's turn and pulse (the colours taken out, the last colour made). Nothing reads them after the routine that wrote them; the ports leave their last values as scaffolding"
source = "game/warp/picture.c, game/warp/circle.c, game/warp/warp.c ($FD:DB97, $FD:DCBD, $FD:EB8B, $FD:ECD5, $FD:ED89, $FD:F123)"

[[var]]
name = "warp_frame"
addr = "7E:051B"
size = 2
subsystem = "warp"
meaning = "Frames since the warp's picture came on: the vblank handler counts them, and the main loop reads them for the plane's place, the circle's size, the colours' pulse and the warp's end"
source = "game/warp/warp.c warp_vblank $FD:DE6E, warp_set_up $FD:DCB8"

[[var]]
name = "warp_frame_ended"
addr = "7E:051E"
subsystem = "warp"
meaning = "Nonzero once the vblank handler has taken the frame the main loop finished; the wait for the next frame clears it and waits for it"
source = "game/warp/warp.c warp_vblank $FD:DE73, warp_wait_for_frame $FD:EAEB"

[[var]]
name = "warp_circle_center_x"
addr = "7E:051F"
subsystem = "warp"
meaning = "Where the circle's centre is across the screen: the middle, set each time the circle is built"
source = "game/warp/circle.c $FD:EB8B"

[[var]]
