# ==============================================================================
# Scenes, the attract program and the decompressor
# ==============================================================================
# Fragment: scene, attract, data (decompressor)
# ---- the decompressor's page ($0300) -------------------------------------------

[[var]]
name = "decompress_source"
addr = "7E:0300"
size = 3
page = "decompress"
subsystem = "data"
meaning = "24-bit pointer to the compressed stream the decompressor reads (in)"
source = "game/data/decompress.c, decompress $C3:0557 (V_SRC)"

[[var]]
name = "decompress_dest"
addr = "7E:0303"
size = 3
page = "decompress"
subsystem = "data"
meaning = "24-bit destination in bank $7E or $7F the decompressor writes (in); the scene program's own transfer takes its source from here"
source = "game/data/decompress.c, decompress $C3:0557 (V_DST); game/scene/screen.c, scene_transfer $7E:38E7"

[[var]]
name = "decompress_length"
addr = "7E:0306"
size = 2
page = "decompress"
subsystem = "data"
meaning = "Decompressed length in bytes (out); the scene program's own transfer takes its size from here"
source = "game/data/decompress.c, decompress $C3:0557 (V_OUT_LEN); game/scene/screen.c, scene_transfer $7E:38E7"

[[var]]
name = "decompress_segment_end"
addr = "7E:0309"
size = 2
page = "decompress"
subsystem = "data"
meaning = "Source offset where the current segment of the stream ends"
source = "game/data/decompress.c, decompress $C3:0557 (V_SEG_END)"

[[var]]
name = "decompress_bits_left"
addr = "7E:030B"
page = "decompress"
subsystem = "data"
meaning = "Control bits left in the current control byte"
source = "game/data/decompress.c, decompress $C3:0557 (V_BITS)"

[[var]]
name = "decompress_control"
addr = "7E:030D"
page = "decompress"
subsystem = "data"
meaning = "The remaining control bits, consumed LSB first (0 literal, 1 back-reference)"
source = "game/data/decompress.c, decompress $C3:0557 (V_CTRL)"

[[var]]
name = "decompress_copy_length"
addr = "7E:030F"
size = 2
page = "decompress"
subsystem = "data"
meaning = "Back-reference byte count minus one; the high byte is cleared on entry"
