[[var]]
name = "scene_call"
page = "scene_program"
dp = 0xF0
stride = 16
subsystem = "scene"
meaning = "The sixteen bytes a scene program's routine takes its values in and leaves its results in, on whichever page it is called on (the scene's own, or a sequence channel's): the arithmetic's operands and results, the program's transfer's mode and register, the matrix code generator's offsets, the script's kept word. Each field is one routine's use, so fields overlap"
source = "game/scene/math.c, scene_multiply $7E:31BF, scene_divide $7E:339F, scene_divide_8_8 $7E:32E2, scene_multiply_signed $C3:094C, scene_find_divisor $C3:0E29; game/scene/race_matrix.c, scene_write_matrix_code $C3:09E9; game/scene/screen.c, scene_transfer $7E:38E7; game/scene/script.c, scene_run_sequence $C3:0AFF"
[[var.field]]
name = "first"
offset = 0x0
size = 2
meaning = "The first operand: the multiplicand, or the 8.8 divide's dividend"
[[var.field]]
name = "second"
offset = 0x2
size = 2
meaning = "The second operand: the multiplier (a signed byte for the signed multiply), or the 8.8 divide's divisor. On the scene's own page this is the controller's held buttons (input_held): what the race's motion leaves here, the next frame's controller read takes as the buttons held the frame before"
[[var.field]]
name = "dividend"
offset = 0x0
size = 4
meaning = "The 32-bit divide's dividend, which the divide leaves as the caller's carry in its top bit and zeros below"
[[var.field]]
name = "product"
offset = 0x4
size = 4
meaning = "The multiplies' 32-bit product"
[[var.field]]
name = "product_third_byte"
offset = 0x6
meaning = "The product's third byte as the last routine to use the cells left it, which the signed multiply adds into its product"
[[var.field]]
name = "divisor"
offset = 0x4
size = 4
meaning = "The 32-bit divide's divisor"
[[var.field]]
name = "fraction"
offset = 0x4
size = 2
meaning = "The 8.8 divide's quotient: an 8.8 fixed-point number"
[[var.field]]
name = "quotient_limit"
offset = 0x4
size = 2
meaning = "The quotient the divisor search stops below (read on the scene's own page)"
[[var.field]]
name = "quotient"
offset = 0x8
size = 4
meaning = "The 32-bit divide's quotient"
[[var.field]]
name = "after_the_product"
offset = 0x8
meaning = "The byte after the product, whatever the last routine to use it left there (the matrix code generator's source base, a divide's quotient or divisor): the unsigned multiply shifts it left through the product's top byte"
[[var.field]]
name = "divisor_less_one"
offset = 0x8
size = 2
meaning = "The 8.8 divide's divisor less one, which it keeps while it runs"
[[var.field]]
name = "remainder"
offset = 0xC
size = 4
meaning = "The 32-bit divide's remainder"
[[var.field]]
name = "transfer_control"
offset = 0x0
meaning = "The program's own transfer: its channel's mode (how it moves the bytes)"
[[var.field]]
name = "transfer_register"
offset = 0x2
meaning = "The program's own transfer: the register it feeds"
[[var.field]]
name = "matrix_table_offset"
offset = 0x0
size = 2
meaning = "The race's matrix code generator: the table offset of the eighth being written"
[[var.field]]
name = "matrix_tile_step"
offset = 0x2
size = 2
meaning = "The race's matrix code generator: the tile's offset across a strip, 4 a tile (a byte, its high half 0)"
[[var.field]]
name = "matrix_plane_pair_step"
offset = 0x4
size = 2
meaning = "The race's matrix code generator: the bitplane pair's offset, 2 a pair (a byte, its high half 0)"
[[var.field]]
name = "matrix_row_step"
offset = 0x6
size = 2
meaning = "The race's matrix code generator: the row's offset within a tile, $20 a row (a byte, its high half 0)"
[[var.field]]
name = "matrix_source"
offset = 0x8
size = 2
meaning = "The race's matrix code generator: the base the generated loads add their offsets to"
[[var.field]]
name = "matrix_destination"
offset = 0xA
size = 2
meaning = "The race's matrix code generator: the page the generated stores start on, which it leaves moved on past the last"
[[var.field]]
name = "bump_push"
offset = 0x6
size = 4
meaning = "The race's bump: how far the bike behind is pushed on, left here where the next multiply carries in from its third byte"
[[var.field]]
name = "race_edge_half_width"
offset = 0x0
size = 2
meaning = "The race's placing of the bikes: the last bike's half width, over which its left edge is worked out; the field's controller read takes it over as the buttons newly pressed (input_pressed shares the cell)"
[[var.field]]
name = "race_edge_middle"
offset = 0x2
size = 2
meaning = "The race's placing of the bikes: where across the screen the last bike's picture is centered; the field's controller read takes it over as the buttons held (input_held)"
[[var.field]]
name = "race_half_size"
offset = 0xC
size = 2
meaning = "The race's placing of Crono: his size halved, at least $40, which his picture's height and width are worked out over; the field's controller read takes it over as the repeat delay (input_repeat_delay)"
[[var.field]]
name = "race_gap"
offset = 0xE
size = 2
meaning = "The race's placing of a bike: the horizon's gap to the plane's top, less one, kept there across the multiply that shifts the cell after the product; the field's controller read takes it over as the buttons of the frame before (input_previous)"
[[var.field]]
name = "race_pose"
offset = 0xE
size = 2
meaning = "The pose the race draws its bikes in this frame, doubled: a byte offset into its tables of pictures"
[[var.field]]
name = "script_scratch"
