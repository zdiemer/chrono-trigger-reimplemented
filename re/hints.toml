# C2:ED59: entries 0-10 point at routines in C2:ED77-F378 (the 7 targets in the
# calls files are among them). The bytes after them are code (a short block
# move ending in RTS, like C2:ED47), not addresses: read as entries they point
# into a byte table, where decoding hit BRK.
# MD4: parsing every window command list the code passes to C2:ED31 (the
# `winlist` deriver) gives only even command bytes below 22, so entries 0-10
# are all the list can reach (entries 0-4, 6 and 7 are used).
[[jumptable]]
at = "C2:ED50"
count = 11
derive = "winlist.handlers"

# ---- Indirect jumps -----------------------------------------------------------

# Menu thread scheduler (C2:81CA): C2:8203 JMP ($0000) starts a thread at the
# address stored at $B2,X, on a fresh stack. Only sub_C28249 writes $B2,X (STA
# $B2,X at C2:824C, A = start address); its 14 call sites (12 JSR, 2 JMP) load
# the constants below (C2:F983 and C2:F9A7 share the call at C2:F9AD), so the
# list is complete for every caller static analysis knows. They are entries
# rather than an `indirect` hint on C2:8203: the tracer treats JMP (abs) as a
# tail call, but a thread never returns into the scheduler (threads end with
# JMP $8216, e.g. C2:83C7), and routines that JMP into the yield code (C2:8403,
# C2:CF5B) would inherit whatever every menu handler returns with. Threads start
# with REP #$30 in effect. The two stack switches (TCS at C2:81FA and C2:8208)
# are the scheduler's own. MD4: `follow = false` states the site's targets are
# these entries (the closure check verifies each is one).
[[indirect]]
at = "C2:8203"
bound = "constant"
follow = false
targets = ["C2:826F", "C2:E91B", "C2:83BD", "C2:89F2", "C2:8A45", "C2:8AB2", "C2:8AF5", "C2:8BB8",
           "C2:9016", "C2:CBBF", "C2:CECE", "C2:F657", "C2:F9B2", "C2:FA06", "C2:FA9F"]

# The menus' tasks give up the rest of their frame with JSR $821E, and wait
# A frames with JSR $822B: each pushes X, Y, P and D on the task's own stack,
# keeps S in the task's record and runs the other tasks; when the task's turn
# comes round again, $C2:8206 takes S back, then D, P, Y and X, and returns to
# the call (A comes back as the scheduler leaves it). DB is neither saved nor
# set on the way to the next task unless every task has had its turn ($C2:81C1
# sets it): the next task runs with the yielding task's DB, so it is read.
# $822B reads A (the frames), with an XBA the check takes as reading both
# bytes. The pushes and pulls are on stacks the pairing can't follow (TCS at
# C2:81FA and C2:8208), so without these a task's every register and flag was
# live across every yield, and after every menu screen's handler, which
# returns into a yield at C2:826C.
[[keeps]]
addr = "C2:821E"
regs = ["X", "Y", "P", "D"]
reads = ["DB"]
resume = "C2:8206"

[[keeps]]
addr = "C2:822B"
regs = ["X", "Y", "P", "D"]
reads = ["A", "AH", "DB"]
resume = "C2:8206"

