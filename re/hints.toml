# ==============================================================================
# MD2: string tables
# ==============================================================================
# Fifteen tables of 16-bit offsets into their own bank whose entries name
# dialog strings. Each is self-describing: entry 0 points at the byte just after
# the table, the entries never decrease, and the last one points one past the
# last string's end, so the table's length and the strings' bounds come from the
# table alone. `target = "text"` runs each string to its end and reports any
# byte between one string's end and the next string, which is the format's
# exact-consumption check: over all fifteen the strings tile their range except
# for the three gaps typed after the tables.
#
# `count` is one less than `slots` everywhere: the last entry is the end
# sentinel, not a string. The tables in F6 and FF sit in ranges MD1 typed
# `mixed`; the expansion splits those around them.
#
# The reader is the dialog decoder (tools/disasm/text.py, docs/MATCHING.md "The
# string encodings"): event command $B8 (C0:3557) stores a table's address at
# $2B-$2D, the dialog commands (C0:3570 and the rest of game/event/dialog.c) an
# index at $2A, and C0:20F2 hands both to C2:57DF through $020C-$020F, which
# loads the string's address from [$020D],Y with Y = 2 x the index. So no code
# holds a long operand into these banks, and an event's table address points
# into the middle of the larger tables (an index is 8 bits, the tables up to
