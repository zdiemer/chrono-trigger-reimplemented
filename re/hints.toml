# ==============================================================================
# MD2: resource pointer tables
# ==============================================================================
# [[resource]] at, count, [name], [kind = ptr24 | ptr16, bank], [slots],
#              target = lz | text | sized | blob, [type], [size],
#              [extent = "next", end], [skip = [i, "first-last", ...]],
#              [format = dialog] (text; tools/disasm/text.py)
# (docs/DISASSEMBLY.md). tools/disasm/resources.py walks the table and types
# both it (ptr24/ptr16) and what its entries point at; an lz entry must be a
# stream the decompressor at C3:0557 consumes exactly, or the run fails.
#
# The loaders share one shape: a resource id is multiplied by three (ASL, ADC)
# into X, two long indexed loads read the pointer's low word and bank byte, and
# the pair is either stored at $0300/$0302, where the decompressor at C3:0002
# takes its source, or kept as a data pointer. `count` is a layout bound for
# every table below: the tables sit next to each other with fill between, and
# the entry after the last one no longer reads as a pointer to a resource.
# `skip` lists entries that don't point at a stream; each is bytes the
# decompressor rejects, so either the id is never used or another loader reads
# them raw. Which is which isn't established, so those bytes stay untyped.

