# sub_C07199, and sub_C07212 / sub_C07217 which enter it at C0:719B: the path
# through C0:71ED sets M=16 (C0:71F2) and, when the compare at C0:71F9 differs,
# leaves through the CLC/RTS at C0:71EB still in 16-bit mode. The only caller is
# the dispatch at C0:717D, whose RTS returns to 8-bit object code: followed with
# M=16 that code decodes into length conflicts and COP operands (C0:6FBF,
# C0:B0F8, C0:B299, C0:B706 ...), and the movies never ran C0:7180 with M=16.
# The 16-bit exit is taken as not happening: these return 8-bit.
[[returns]]
addr = "C0:7199"
m = 8
x = 8

[[returns]]
addr = "C0:7212"
m = 8
x = 8

[[returns]]
addr = "C0:7217"
m = 8
x = 8

# sub_C30011 jumps to C3:0EFA, which pushes D, DB and P and starts a chain of
# JSR $0F83 blocks through JMP ($03F0) (see the C3:0F32 hint). sub_C30F83 counts
# its calls in $F4; on the fourth it discards its own return address (PLA at
# C3:0FA5) and finishes the whole operation, ending in the pulls and RTL of
# C3:10BA, so the RTL returns to sub_C30011's caller with the P pushed at
# C3:0EFC: the caller's widths. The tracer attributes that return to
# sub_C30F83, so it never sees sub_C30011 return.
[[returns]]
addr = "C3:0011"

# MD4: the attract program also calls C3:0EFA directly (JSL at $7E:9A4F, in a
# task a sequence script adds); it returns the same way, through the RTL of
# C3:10BA with the P it pushed at C3:0EFC.
[[returns]]
addr = "C3:0EFA"

# Calls that never return. Each resets the stack or loops forever:
# C0:5F6E loads a colour into X and branches to C0:2E1E, which blanks the
# screen, points both RAM vectors at RTI and ends in BRA to itself (C0:2E65).
# Unused event command table entries point here.
[[noreturn]]
addr = "C0:5F6E"

# C0:260E and C0:4181 set S to $06FF (C0:2643-2646, C0:4189-418C) and jump to
# C3:0000 and FD:C000, the mode loaders.
[[noreturn]]
addr = "C0:260E"

[[noreturn]]
addr = "C0:4181"

# C0:3B4B (and C0:3B98, which branches to it) sets S to $06FF at C0:3B91 and
# branches to C0:0000.
[[noreturn]]
addr = "C0:3B4B"

[[noreturn]]
addr = "C0:3B98"

# The RAM vector stubs at $00:0500/$00:0504 jump to these handlers from
# whatever code the interrupt stopped, so they are entered with any widths
# (coverage has C0:EA63, C0:ECCC and C2:015E entered with three or four of the
# combinations). Each first sets A and X to 16 bits, before anything width-dependent.
# These entries add the unknown-width context next to the m8 x16 ones above.
[[entry]]
addr = "C0:EA63"
kind = "vector"

[[entry]]
addr = "C0:ECCC"
kind = "vector"

[[entry]]
addr = "C2:015E"
kind = "vector"

[[entry]]
addr = "C2:0345"
kind = "vector"

[[entry]]
addr = "C3:0548"
kind = "vector"

[[entry]]
addr = "C3:0529"
kind = "vector"

[[entry]]
addr = "FD:DE15"
kind = "vector"

[[entry]]
addr = "FD:DE87"
kind = "vector"

# C2:EFD3 is the RTS the PER at C2:EFCD makes every text control code handler
# return to. The handlers at C2:F022, F068, F071, F08D, F0A2, F0B8 and F0D1
# return with M=8 (their RTS runs m8 x16), so the RTS also runs m8 x16.
[[entry]]
addr = "C2:EFD3"
m = 8
x = 16

# C2:8C52 runs with both widths (coverage: m8 x8 and m16 x16). The handlers of
# the C2:8C5B table return 8-bit or 16-bit (C2:8D05, C2:8D45 and C2:8D8F leave
# M and X 16-bit). With M=8 the bytes are a 2-byte LDA immediate and an XBA;
# with M=16 a 3-byte LDA immediate that swallows the XBA and continues at
# C2:8C55. Either way the high byte of A ends up zero before the PLP at C2:8C57
# restores the caller's widths. The source writes the 8-bit decode.
[[overlap]]
addr = "C2:8C52"
m = 8
x = 8

# ==============================================================================
# MD1: code run from RAM
# ==============================================================================
# [[ramcode]] name, base, source, format = lz | copy | writes, [size], [end, m, x]
# (docs/DISASSEMBLY.md). The analysis traces these images at their run address.

# The attract, title and jet bike race program. C3:0056-0073 loads the low
# word of the resource pointer at FE:0003 as the source offset in bank C3,
# decompresses to $7E:3000 and jumps there. The resource table at FE:0000 holds
# 24-bit stream pointers the program also loads by index (sub_7E3691).
# The output is 34175 bytes; the section stops at $7E:B574, where C3:09E9
# (called with the WRAM port set to $7E:B574, e.g. from $7E:3CEF) writes
# generated instructions over the end of the image at run time.
[[ramcode]]
name = "attract_program"
base = "7E:3000"
source = "C3:1313"
format = "lz"
size = 0x8574

# The block move stub the menu and FF code call. C2:8635-863E stores MVN with
# both banks $7E and then RTL; the callers patch the bank bytes before other
# calls (see the returns hint on 7E:9690).
[[ramcode]]
name = "mvn_stub"
over = "attract_program"
base = "7E:9690"
source = "C2:8635"
end = "C2:863E"
m = 16
x = 16
format = "writes"
size = 4

# JML stubs for NMI and IRQ at $00:0500 and $00:0504, as each mode's installer
# writes them (the targets are entries elsewhere in this file).
[[ramcode]]
name = "vectors_c3"
base = "00:0500"
source = "C3:0016"
end = "C3:002F"
m = 8
x = 16
format = "writes"
size = 8

[[ramcode]]
name = "vectors_c2"
base = "00:0500"
source = "C2:8406"
format = "copy"
size = 8

# $7E:3000 dispatches on the mode in $0384 masked to 0-31 (AND at $7E:3006);
# the table at $7E:3043 runs up to its first handler, sub_7E3063 at $7E:3063,
# so 16 entries.
[[jumptable]]
at = "7E:300A"
bound = "guard"
count = 16

# MD4: task lists in work RAM, derived from the attract program's sequence
# scripts (tools/disasm/seqscript.py) and the code that fills the lists
# (tools/disasm/derive.py). $7E:39CF calls through the words at $0940,X: the
# list the adders $7E:3974 and C3:0CF8 fill (from X; C3:0CF8 only for sequence
# command $A8). $7E:3998 runs the list the adders $7E:395E and C3:0CE2 fill
# (command $AA) and the runner's exit $7E:39B1 rewrites (the handler's X), and
# removes entries from $0920 (its dispatch operand reads $0950, a list nothing
# in the program fills: the call logs show the $0920 tasks called from this
# site). $7E:37F6 calls through the word at $00F0 (X = 0), which only C3:0C55,
# sequence command $A0, stores, from its operand. The stores to the lists
# (STA $0920,X / $0940,X) in the program and C3 are those in the adders and the
# exit; sequence commands that store to memory are checked not to write the
# lists, $00F0 or the channel pointers. Scripts start where the program stores a
# constant to $0A20 or $0B20, and continue through the commands' gotos and
# calls, the pointer stores of command $A2 and the pointer table code $7E:3F59
# stores (listed in derive.py). All the targets of the old movie-only lists
# (11, 26, 4) are among the derived ones.
[[jumptable]]
at = "7E:39CF"
count = 0
derive = "seqscript.tasks_0940"

[[jumptable]]
at = "7E:3998"
count = 0
derive = "seqscript.tasks_0920"

[[jumptable]]
at = "7E:37F6"
count = 0
derive = "seqscript.call"

# $7E:B574 is written at run time by C3:09E9, which emits only LDA immediate,
# TCD, LDA absolute and STA direct page instructions and ends them with an RTS
# (C3:0A22-0A8A). None of those changes the width bits, so the routine returns
# with its caller's widths.
[[returns]]
addr = "7E:B574"

# M3: those instructions as a section. The program calls the generator from
# three places ($7E:3CFB, $7E:799D, $7E:8569; no other code has the call), and
# each sets the WRAM port to $7E:B574 and X = $0C00, Y = $0200 just before,
# all constants. The routine reads nothing but
# its table at C3:09D9, so it always writes the same code: 1024 LDA absolute /
# STA direct page pairs (source addresses from Y and the table, direct page
# offsets from X) with a TCD to the next page every 128 pairs, and an RTS.
# `run` executes C3:09E9 with those registers; the result must be 5153 bytes,
# and it is the RAM the jet bike race runs (compared with a trace of
# events-jetbike-race). The Beyond Time ending runs the same code.
[[ramcode]]
name = "race_matrix_code"
base = "7E:B574"
source = "C3:09E9"
format = "run"
m = 8
x = 16
regs = { x = 0x0C00, y = 0x0200 }
size = 5153

# Calls whose operand the program writes at run time (MD4: derived). The
# `operands` deriver (tools/disasm/derive.py) takes every absolute or long store
# into the operand bytes of a transfer in RAM code, resolves its value, and adds
# the operand the image holds; a store into the operand of a transfer without
# such a hint, or of a value it can't resolve, is a problem. The JSR at $7E:3023
# is the attract main loop's per-frame call (STA at $7E:3CE4, $7E:70D7, $7E:96FE,
# STX at $7E:8794, $7E:87D0; MD1's list had missed the STX stores and $7E:96FE);
# $7E:35FC (stores at $7E:3CDE, $7E:86EC); $7E:5E43 (the long STA at $7E:8C5D).
[[indirect]]
at = "7E:3023"
derive = "operands.7E3023"

[[indirect]]
at = "7E:35FC"
derive = "operands.7E35FC"

[[indirect]]
at = "7E:5E43"
derive = "operands.7E5E43"

# M3: instructions the program replaces for a while (`patch`), found by the
# miss report (ct_dev --misses) as RAM code run with an opcode the image doesn't
# have, and the stores that write it. Operands the program writes (the JSRs above,
# immediates, the BRA at $7E:3616) need no section: generated code fetches the
# operands of RAM code at run time.
#
# $7E:3634-3635 (INX, NOP in the image) during the race: $7E:45C9 copies the two
# bytes at $7E:368F (a BRA over the rest of the routine, $7E:366C) over them, and
# $7E:45D1 writes NOP, INX; each is a 16-bit store (coverage has both at m16 x16).
[[ramcode]]
name = "patch_3634_skip"
patch = "attract_program"
base = "7E:3634"
source = "7E:45C5"
end = "7E:45C9"
m = 16
x = 16
format = "writes"
size = 2

[[ramcode]]
name = "patch_3634_swap"
patch = "attract_program"
base = "7E:3634"
source = "7E:45CE"
end = "7E:45D1"
m = 16
x = 16
format = "writes"
size = 2

# $7E:510D (LDA $B0 in the image) becomes an RTS: $7E:487E-4880, 8-bit.
[[ramcode]]
name = "patch_510d_return"
patch = "attract_program"
base = "7E:510D"
source = "7E:487E"
end = "7E:4880"
m = 8
x = 16
format = "writes"
size = 1

# $7E:A074-A075 (BCS $A04E in the image) become two NOPs around the call at
# $7E:9C36 in the Beyond Time ending: $7E:9C29-9C2C, restored from $F0 after.
[[ramcode]]
name = "patch_a074_nops"
patch = "attract_program"
base = "7E:A074"
source = "7E:9C29"
end = "7E:9C2C"
m = 16
x = 16
format = "writes"
size = 2

# $7E:582E-582F (BMI $5834 in the image, where the star field task $7E:579B picks
# a sprite's attribute byte) become BRA $5830, a branch to the next instruction,
# so every star takes the fall-through attribute: $7E:5640-5643 loads a constant
# with 16-bit A and stores the word at $582E. Two sites run it: JSR $5640 at
# $7E:8F8B in the handler of mode $0D (after REP #$20 at $7E:8F85; the Dream
# Project ending's staff credits, which then start the script at $7E:93E3 that
# adds the task) and sequence command $A0 at $7E:55EA (mode 4's script). The STA at
# $7E:5643 is the only store in analysed RAM code addressing $582E or $582F
# (absolute, long, or indexed from up to $400 below), and its value is a constant,
# so the patch has one image. Nothing in the program writes the BMI back; entering
# the program through C3:0000 decompresses it again. Found by the fallback player's misses file
# (docs/RECOMP.md, "Without the interpreter"): endings-telepod-lavos, retimed,
# reaches the credits, and a bus write watch shows $7E:5643 writing the word
# 3 frames after the program dispatches mode $0D, and nothing else writing it there.
[[ramcode]]
name = "patch_582e_bra"
patch = "attract_program"
base = "7E:582E"
source = "7E:5640"
end = "7E:5643"
m = 16
x = 16
format = "writes"
size = 2

