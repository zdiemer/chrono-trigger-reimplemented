# Menu mode dispatch (C2:826F): $67 indexes the word table at C2:8292 (16 entries,
# ending where code starts at C2:82B2), each entry pointing at a per-mode
# sub-table indexed by $68. Every sub-table sits directly before its first
# handler, which fixes its length. Modes 8-10 point at C2:8291 and mode 15 at
# C2:FE0A, neither of which follows that layout, and none of them ran in the
# movies, so they are left out. Handlers run m8 x16 (SEP #$20 at C2:828C) and
# return through the PER to C2:826C. Unexecuted entries (AC1D, BF6D, CF92,
# D4F8, D506, D6C3, D715, D778, E6AE, E705) all decode as plausible handlers,
# most doing the same JSR $E984 / BIT $0D1D input check as the executed ones.
[[indirect]]
at = "C2:828E"
bound = "layout"
targets = [
    "C2:99CE", "C2:9A1B",                                   # mode 0, C2:99CA
    "C2:9C31", "C2:9C39", "C2:9C70", "C2:9CA5",             # mode 1, C2:9C29
    "C2:AA40", "C2:AA4A", "C2:AA86", "C2:AAC8", "C2:AB4A", "C2:AC1D",  # mode 2
    "C2:B35D", "C2:B365", "C2:B36D", "C2:B3AE", "C2:B48E",  # mode 3, C2:B353
    "C2:BF3D", "C2:BF45", "C2:BF6D", "C2:BF9F",             # mode 4, C2:BF35
    "C2:C627", "C2:C65D", "C2:C6B9",                        # mode 5, C2:C621
    "C2:CEDC", "C2:CEFD", "C2:CF61", "C2:CF92",             # mode 6, C2:CED4
    "C2:C7AC", "C2:C7E0",                                   # mode 7, C2:C7A6 (+C6B9)
    "C2:D4F8", "C2:D506",                                   # mode 11, C2:D4F0 (+CF61, CF92)
    "C2:D52B", "C2:D546", "C2:D58B", "C2:D645", "C2:D690",  # mode 12, C2:D519
    "C2:D618", "C2:D6C3", "C2:D715", "C2:D778",
    "C2:E1ED", "C2:E21E", "C2:E236", "C2:E201", "C2:E209",  # mode 13, C2:E1E3
    "C2:E613", "C2:E61B", "C2:E6AE", "C2:E705",             # mode 14, C2:E60B
]

# MD4: the object system's code addresses, derived from every object script in
# the ROM (tools/disasm/objscript.py, tools/disasm/derive.py). C2:051D walks the
# 64 object slots at $0B30-$1B30 and jumps through each slot's word $0000,X,
# copied to $50 (handlers run m8 x16 with X = slot and return carry set to free
# it). The only store of a new value into a slot's word is C2:04A7 in
# sub_C2048A / sub_C204CD, from X; the other writes to the slot array are the
# MVN copies at C2:25B4-25EA and C2:2E2F-2EBA, which save and restore whole
# slot arrays. Their callers load X with a constant (C2:0F63 at C2:04E0 and
# C2:0502, the script runner; C2:10C4, 10F7, 1590, 159E, 15AC, 15BA, 1DE2,
# 63A6, 7417, 742D, 7441) except object script commands $35 (C2:183F) and $42
# (C2:1A49), whose word operands the parse collects. Scripts are found from
# every place the code starts one: the constant arguments of sub_C204D9 and
# sub_C204FB and constant stores to slot +$07, the eight scenes' script streams
# (C6:FFE0 table, run at $7F:0400) and their $7E:8480 word tables (C6:FFC0
# table), and the script commands that name scripts. Every target the movie-only
# list here had (28) is among the derived ones.
[[indirect]]
at = "C2:0553"
derive = "objscript.handler"

# Object script command $34 (C2:1807): JSR to the word operand through JMP
# ($005B) at C2:1819 (m8 x16, returns to C2:1813). The targets are the $34
# operands of every script the parse reaches; the 6 the movies ran are among
# them.
[[indirect]]
at = "C2:1819"
derive = "objscript.jsr"

# Object script command $4E (C2:181C): JSL to the long operand through JML
# [$005B] at C2:1836 (m8 x16, returns to C2:1830). The targets are the $4E
# operands of every script the parse reaches; C6:E237, the one the movies ran,
# is among them.
[[indirect]]
at = "C2:1836"
derive = "objscript.jsl"

# sub_C2EFBE: A indexes the 16-entry word table at C2:EFD4 (it ends where the
# first handler, C2:EFF4, starts); PER makes the handler return to the RTS at
# C2:EFD3. Entries 0 and 13-15 are that RTS. Complete: the only caller, C2:EF8A,
# runs it for bytes below $10 (CMP #$10; BCS at C2:EF86-EF88) that aren't 0.
[[indirect]]
at = "C2:EFD0"
bound = "guard"
targets = ["C2:EFD3", "C2:EFF4", "C2:F005", "C2:F011", "C2:F022", "C2:F036",
           "C2:F0A2", "C2:F071", "C2:F08D", "C2:F0B8", "C2:F068", "C2:F0C1",
           "C2:F0D1"]

# D = $0300 there, so STY $F0 at C3:0F30 writes $03F0. Y is one of the four
# constants loaded at C3:0F05-0F22 (entry points into the chain of JSR $0F83
# blocks). Complete.
[[indirect]]
at = "C3:0F32"
bound = "constant"
targets = ["C3:0F35", "C3:0F48", "C3:0F5B", "C3:0F6E"]

# Computed entry into a run of 222 LDA $nnnn,Y / STA $nnnn,X pairs ending in the
# RTS at CE:E7C7: sub_CD3616 sets $4B = $E7C7 - 6n, and 222 = $DE is the bound
# checked at CD:35E6. Any pair start in CE:E293-E7C1 (or the RTS) can be entered; they all
# fall through to the RTS with the same inputs, so the first one, CE:E293,
# stands for the set.
[[indirect]]
at = "CE:E7CC"
bound = "guard"
targets = ["CE:E293"]

# ==============================================================================
# MD1 (docs/MATCHING.md): jump table bounds
# ==============================================================================
# Every JMP/JSR (abs,X) the analysis sizes gets a count derived from the code
# instead of the length heuristic: an index mask or compare before the dispatch,
# a table that runs up to its first handler or other code, or a table that ends
# where another dispatcher's table begins. Entries are numbered from 0.

# C0:1D3E, C0:1D4C, table C0:1D56: X is the slot index in $DB; the table runs up
# to its first handler at C0:1D5E.
[[jumptable]]
at = "C0:1D3E"
bound = "layout"
count = 4
[[jumptable]]
at = "C0:1D4C"
bound = "layout"
count = 4

# C0:1E04, table C0:1E92: The index is masked to 0-6 before TAX (C0:1E00), so
# entries 0-3; the table runs up to its first handler at C0:1E9A.
[[jumptable]]
at = "C0:1E04"
bound = "guard"
count = 4

# C0:21EA, table C0:21EE: The index is $39 minus one, doubled, with no guard;
# the table runs up to its first handler at C0:220E. The length heuristic
# stopped at 9, but the calls files show entry 13 called from here.
[[jumptable]]
at = "C0:21EA"
bound = "layout"
count = 16

# C0:4009, table C0:400E: The index is $DF minus a constant, doubled; the table runs up to
# its first handler at C0:4036.
# Event scripts: $DF is the mode operand of event command $FF (C0:3FAF), $90
# and up; derived from every event script.
[[jumptable]]
at = "C0:4009"
count = 20
derive = "eventscript.mode"

# C0:5977, C0:5AB1, table C0:5D6E: The event command byte is masked to 0-255
# before ASL (C0:5970, C0:5AAA): the whole 256-entry command table, as for
# C0:5910. The heuristic gave C0:5AB1 12 entries; the calls files show higher
# ones called from it.
[[jumptable]]
at = "C0:5977"
bound = "guard"
count = 256
[[jumptable]]
at = "C0:5AB1"
bound = "guard"
count = 256

# C0:5BE6, table C0:5BF2: X is the slot index in $D9; the table runs up to its
# first handler at C0:5BFA.
[[jumptable]]
at = "C0:5BE6"
bound = "layout"
count = 4

# C0:6307, C0:6398, C0:6433, table C0:6467: An 8-bit index from an event script
# operand; the table runs up to its first handler at C0:6487.
# Event scripts: the operator of commands $12, $14 and $16, derived from every
# event script a location can load (tools/disasm/derive.py, `eventscript`).
[[jumptable]]
at = "C0:6307"
count = 16
derive = "eventscript.if_var_const"
[[jumptable]]
at = "C0:6398"
count = 16
derive = "eventscript.if_var_var"
[[jumptable]]
at = "C0:6433"
count = 16
derive = "eventscript.if_memory"

# C0:633D, C0:63D7, table C0:6477: The same list as C0:6467 from its entry 8 on:
# it runs up to code at C0:6487.
# Event scripts: the operator of commands $13 and $15, derived.
[[jumptable]]
at = "C0:633D"
count = 8
derive = "eventscript.if_var_const16"
[[jumptable]]
at = "C0:63D7"
count = 8
derive = "eventscript.if_var_var16"

# C0:6FA3, table C0:6FA7: Negative values branch away (C0:6F9F); the table runs
# up to its first handler at C0:6FB9.
[[jumptable]]
at = "C0:6FA3"
bound = "guard"
count = 9

# C0:717D, table C0:7181: Negative values branch away (C0:7179); the table runs
# up to its first handler at C0:7199.
