# Analysis hints for tools/disasm: facts static analysis can't infer by itself.
# Addresses are SNES bus addresses (BB:AAAA). Widths: m/x = 8 or 16.
#
#   [[entry]]        addr, m, x, [name], [kind]     code entry point (omit m/x: unknown)
#   [[name]]         addr, name                     label only
#   [[jumptable]]    at, count, [kind=abs|long], [table], [targets = [...]]
#                                                   JMP/JSR (abs,X) at `at`; targets for
#                                                   tables filled at run time
#   [[returns]]      addr, m, x                     widths after the function returns
#                                                   (omit m or x: the caller's)
#   [[state]]        addr, m, x                     force widths at an address
#   [noreturn]       addrs = [...]                  calls that never come back
#   [[noreturn]]     addr                           the same, one per entry
#   [[inline_args]]  addr, size                     bytes after JSR/JSL to skip
#   [[keeps]]        addr, regs = [...], [reads],   a call that returns with these
#                    resume                         registers (A AH X Y P DB D) as the
#                                                   caller had them, reading only `reads`:
#                                                   a task switch the stack pairing
#                                                   can't follow; `resume` is where the
#                                                   caller's turn comes back (checked by
#                                                   tools/disasm/keeps.py)
#   [[indirect]]     at, targets = [...]            JMP (abs) / JML [abs] targets, or the
#                                                   targets of a JSR/JSL whose operand
#                                                   code writes at run time
#   [[data]]         start, end, [type], [name]     never decode as code; type is one of
#                                                   tools/disasm/hints.py DATA_TYPES
#   [[overlap]]      addr, m, x                     an instruction that runs with widths
#                                                   giving different lengths; the source
#                                                   writes the decode under m/x
#   [[ramcode]]      name, base, source, format = lz | copy | writes, [size],
#                    [end, m, x], [over]            code the game runs from RAM
#   [[resource]]     at, count, [name], [kind = ptr24 | ptr16, bank], [slots],
#                    target = lz | text | sized | blob, [type], [size],
#                    [extent = "next", end], [skip],
#                    [format] (text; lz: event)     a pointer table a loader
#                                                   indexes by a resource id;
#                                                   types it and its targets
#   fill = true on [[data]]: a background type for a range (every byte no other
#                    region claims)
#   derive = "name.part" on [[indirect]] / [[jumptable]]: targets derived from
#                    the data the code interprets (tools/disasm/derive.py)
#   header_vectors   enter the native NMI/IRQ and the reset vector of the header

# MD4: the native NMI ($00:FFEA) and IRQ ($00:FFEE) vectors point at the JML
# stubs $00:FF10 and $00:FF14, reset ($00:FFFC) at $00:FF00. The COP and BRK
# vectors point at $00:FF18, table bytes: the code set has no BRK or COP. The
# emulation-mode NMI and IRQ vectors are $FFFF (reset runs with interrupts off
# until it leaves emulation mode).
header_vectors = true

# Hardware vector: SEI; CLC; XCE; JML $FD:C000
[[entry]]
addr = "00:FF00"
m = 8
x = 8
name = "vec_reset"
kind = "vector"

[[name]]
addr = "00:FF10"
name = "vec_nmi"

[[name]]
addr = "00:FF14"
name = "vec_irq"

