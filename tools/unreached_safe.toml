# Reviewed exclusions from the audited subsystems' conservative reach.
# These are not counted as instructions executed by fuzzing. `depends` names
# the definitions each argument rests on (path:symbol: a function, macro,
# constant or table with the lines naming it, or a RAM-map variable); the
# ledger hashes those, the entry's registry row less its time estimate, and
# the C the row runs and guards with. Changing any of them requires another
# review; edits elsewhere in the same files do not.

[[safe]]
name = "scene_staff_roll_set_up"
runs = "7E36B9-7E36C1"
depends = ["game/scene/staff_roll.c:copy_colors", "game/scene/screen.c:scene_copy_resource_to"]
why = "These bytes are the shared resource copier's upper-bank arm. Every copy owned by the staff-roll setup is a palette copy through copy_colors, which clears all but the low byte of decompress_dest before the call. Its destination bank is therefore the lower bank for every admitted input. Preserve that palette destination selection at retirement; this does not claim the general copier cannot copy to the upper bank."

[[safe]]
