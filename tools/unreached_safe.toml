depends = ["game/event/characters.c:cast_enemy", "game/event/characters.c:unpack", "game/event/characters.c:set_calls", "game/event/characters.c:ENEMY_TOO_FAR"]
why = "The port stops at C0483A on graphics overflow; unreached_overflow compares at that handoff. These bytes belong to the original-only diagnostic after it. Keep a native failure for overflow when the handoff retires."

