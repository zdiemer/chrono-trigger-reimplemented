why = "text_chosen rejects a zero text-table bank before every say/ask operation. These bytes are the call to the original's missing-table diagnostic (the diagnostic itself now belongs to field_check_the_script, a separately registered field entry); no admitted port state enters them. Preserve the precondition at retirement."

