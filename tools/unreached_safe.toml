[[safe]]
name = "overworld_follow"
runs = "C24123-C24124"
sources = ["game/overworld/followers.c", "game/overworld/party.c"]
why = "The original's stationary-walker trap is called only after setting one integer velocity to +1 or -1 and the other to zero (4138/4152 -> 40E4). Both being zero is impossible on those paths. walk_a_leg expresses this invariant; both axes and signs are compared by the follower recipes."

[[safe]]
name = "overworld_main_loop"
runs = "C22603-C22605,C2267E-C22680"
sources = ["game/overworld/main_loop.c", "re/ram.toml"]
why = "Reviewed equivalence for the two sign-refresh arms after map-view/time-dial return: each original instruction increments byte 1B59 modulo 256, only if byte 1B58 is nonzero; its N/Z are overwritten by the following LDA. Both call set_the_sign_again, with exactly that predicate and uint8_t conversion (including 255 -> 0). These six instructions were not executed in the fuzz comparisons; a returning-screen fixture remains useful before teardown."

[[safe]]
name = "warp_set_up"
runs = "FDEC19-FDEC1A,FDEC24-FDEC24,FDEC30-FDEC31,FDEC5B-FDEC5C,FDEC68-FDEC69"
sources = ["game/warp/circle.c", "game/warp/warp.c", "game/warp/warp_data.h"]
why = "The shared circle builder fixes both centres at 128 and accepts radius 0 or 2..127. All 32 cartridge ramp values satisfy this (CRC-checked); radius 0 clears the window. Nonzero half-widths never exceed 127, so centre/edge clamps and the radius>=128 upper-half path cannot run. Setup uses radius 0; opening/closing frame recipes cover the ramp. Recheck if centres or ramp change."
