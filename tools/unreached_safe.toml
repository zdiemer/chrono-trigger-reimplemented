depends = ["game/event/flow.c:compares_words", "game/event/flow.c:WORD_OPERATORS"]
why = "Word-OR is outside WORD_OPERATORS (7); the word comparison guard rejects operator 7. All seven admitted word operators and all eight byte operators are fuzzed. Preserve this bound as an assertion when retiring the guard."

