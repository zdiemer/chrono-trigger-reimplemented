# Reviewed exclusions from the six subsystems' conservative audit reach.
# These are not counted as instructions executed by fuzzing. `depends` names
# the definitions each argument rests on (path:symbol: a function, macro,
# constant or table with the lines naming it, or a RAM-map variable); the
# ledger hashes those, the entry's registry row less its time estimate, and
# the C the row runs and guards with. Changing any of them requires another
# review; edits elsewhere in the same files do not.

[[safe]]
name = "field_restart_wait_for_vblank_loop"
runs = "C04181-C04185"
depends = ["game/field/frame.c:wait_for_vblank_pass", "game/event/screen.c:event_screen_dispatch", "game/event/screen.c:restart_on_the_machine", "game/event/screen.c:screen_commands"]
why = "Screen-command restart dependency, separately registered in field. The five-byte wait is the documented timing escape in wait_for_vblank_pass: it accepts either a pending flag or current vblank after the interrupt acknowledged that flag, then hands back at C04186. This intentionally avoids the original's flag-read race; it is not a claim of byte-exact timing equivalence. The following 11 bytes (blank the display, S=06FF, jump to FDC000) are field_restart_in_the_dark's, a separately registered field entry outside the audit's subsystems. event_screen_dispatch hands only selector 96 to C04181. These five bytes are reviewed, not fuzz-executed; preserve the vblank-only restart precondition before retiring this dependency."

[[safe]]
name = "input_take_ready_controller"
runs = "C28523-C28526"
depends = ["game/core/input.c:take_controller_sample", "game/core/input.c:input_read_controller", "game/core/input.c:input_stop_reading", "game/core/input.h:RESET_BUTTONS"]
why = "Reviewed reset handoff: the original JML transfers to C0FF00 only for controller bits 3030. input_take_ready_controller's sample (take_controller_sample, input_read_controller) returns CONTROLLER_RESET for exactly RESET_BUTTONS (L/R/Select/Start); input_stop_reading sets 16-bit widths and stops at C0FF00 on page/bank zero. This four-byte transfer is not executed by the recorded fuzz inputs; preserve the reset-chord handoff when retiring it."

[[safe]]
name = "event_screen_dispatch"
runs = "C05F6E-C05F73"
depends = ["game/event/bridge.c:run_on_the_machine", "game/event/bridge.c:through_the_table", "game/event/engine.c:run"]
why = "Inlined bytes shared with event_run_init_scripts, assigned to the screen dispatcher by entry order. The conservative command-table walk includes the unknown-command diagnostic (load message 1639, branch to C02E1E). An opcode without a C row goes through through_the_table on the machine; the native runner instead calls program_needs_the_machine. These original-only diagnostic bytes are not an implemented command. Replace the delegation with an explicit invalid-command failure before retiring that fallback."

