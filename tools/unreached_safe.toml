[[safe]]
name = "event_cmd_cast_npc"
runs = "C046D1-C046D6,C05CB0-C05CB5"
depends = ["game/event/characters.c:npc_castable", "game/event/characters.c:unpack", "game/event/characters.c:set_calls", "game/event/characters.c:NPC_TOO_FAR", "game/field/cast.c:cast_graphics_entry_for"]
why = "C046D1 is the explicit graphics-overflow handoff: unreached_overflow compares both machines there, before the original-only error handler. C05CB0 is the no-free-shared-graphics diagnostic excluded by npc_castable/cast_graphics_entry_for. Keep both failures explicit when retiring the machine."

[[safe]]
name = "event_cmd_cast_enemy"
