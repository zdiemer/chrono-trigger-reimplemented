# Targeted states for paths missing from the library's coverage.
# base is a recipe in fuzz_routines.toml (name[:variant]); args replace the
# same fill area/register range, otherwise append. All numbers in areas are hex.

# Explicitly reviewed shared C implementations. A caller's comparison can
# discharge another owner's bytes only here, never merely because an
# interpreted call-out happened to visit that address on both machines.
[shared]
# flow.c's word operators use the same comparison helpers as its byte entry.
event_cmd_if_compares = ["event_cmd_if_compares_word", "event_cmd_if_compares_variable_word"]
# screen.c: the per-effect entries are machine bridges over run_screen_command,
# the same table the screen command runs (event_cmd_screen_command:unreached_effects).
event_screen_uncover_right = ["event_cmd_screen_command"]
event_screen_uncover_left = ["event_cmd_screen_command"]
event_screen_cover_right = ["event_cmd_screen_command"]
event_screen_cover_left = ["event_cmd_screen_command"]
event_screen_end_field = ["event_cmd_screen_command"]
event_screen_ripple = ["event_cmd_screen_command"]

[[case]]
base = "event_cmd_screen_command"
variant = "unreached_effects"
args = ["--range", "Y=0100-0100", "--fill", "7E016D-7E016E=0000",
        "--fill", "7F:[Y]+2002,1=90,91,92,93,94,95,97,98,99,9A,9B,9C,9D,9E"]
why = "All non-restart screen effects, including curtain start/wait/completion and ripple idle/running/played; exclude the separate party service so random character records cannot invalidate its fixture."

[profile.movement]
args = ["--range", "Y=0100-0100", "--fill", "7E016D-7E016D=00",
        "--fill", "7F2102-7F2104=00,02,04", "--fill", "7F2000-7F2000=03",
        "--fill", "7E0197-7E019C=0000,0002,0004",
        "--fill", "7E1800-7E18FF=08-0A", "--fill", "7F0200-7F03FF=08-0A",
        "--fill", "7E1A01-7E1A7F:2=00,01", "--fill", "7E1A80-7E1AFE:2=00,01",
        "--fill", "7E1B80-7E1BFE:2=00", "--fill", "7E0F00-7E0F7E:2=80",
        "--fill", "7E1100-7E117E:2=00", "--fill", "7E1B01-7E1B7F:2=01",
        "--fill", "7E1C81-7E1CFF:2=00-03", "--fill", "7E1000-7E107E:2=01-04",
        "--fill", "7E1D0A-7E1D0F=00", "--fill", "7E1C80-7E1CFE:2=02"]

[[case]]
base = "event_cmd_if_compares"
variant = "unreached_operators"
args = ["--range", "Y=0100-0100", "--fill", "7F2102-7F2102=00",
        "--fill", "7F2103-7F2103=00,01,80,FF", "--fill", "7F2104-7F2104=00-07",
        "--fill", "7F0200-7F0200=00,01,80,FF"]
why = "All eight operators with equal, zero, disjoint and overlapping operands, including the usually false equality and zero-OR paths."

[[case]]
base = "event_cmd_if_compares_word"
variant = "unreached_operators"
args = ["--range", "Y=0100-0100", "--fill", "7F2102-7F2102=00",
        "--fill", "7F2103-7F2104=0000,0001,8000,FFFF", "--fill", "7F2105-7F2105=00-06",
        "--fill", "7F0200-7F0201=0000,0001,8000,FFFF"]
why = "All seven word comparisons, including equal values and zero intersections. These share helpers owned by the byte comparison in the inventory."

[[case]]
base = "event_cmd_if_well_on_screen"
