# ---- field --------------------------------------------------------------------------------------
# The field's frame wait ($C0:EC60) counts its frame up and spins until the
# vblank handler clears it; --tick-at at the spin stands in for that handler
# on both machines (255 passes wrap the count to zero), so the waits return.

[[case]]
base = "field_move_screen_effect_on:close-ripple"
variant = "unreached_ripple"
remove = ["--stop-at-call"]
args = ["--fill", "7E0139-7E0139=0C", "--fill", "7E0153-7E0153=00,01", "--tick-at", "C0EC71=7E0152", "--budget", "16000000"]
iterations = 200
why = "The whole ripple, its frames waited out: the copy settling, the circle opening, held and closing, and the script seeing it played, with either of the line effects' tables."

[[case]]
base = "field_move_screen_effect_on:close-ripple"
variant = "unreached_close"
remove = ["--stop-at-call"]
args = ["--fill", "7E0139-7E0139=0B", "--tick-at", "C0EC71=7E0152", "--stop-at-call", "C02643", "--budget", "16000000"]
iterations = 200
why = "The field's close, its frames waited out and the field put aside, compared where the scene starts on its fresh stack (its own entry)."

[[case]]
base = "field_take_choice_buttons"
