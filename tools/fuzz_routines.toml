[[routine]]
name = "scene_load_sprite_list"
subsystem = "scene"
state = "attract"
args = ["--long", "--d", "0000", "--db", "00", "--fill", "7E0012-7E0012=00-01", "--fill", "7E0014-7E0014=09-09"]
why = "the OAM index below $200 and the high-table pointer in $09xx"

[[routine]]
name = "scene_load_sprite_list"
variant = "loose"
subsystem = "scene"
state = "attract"
args = ["--long", "--d", "0000", "--db", "00", "--fill", "7E0012-7E0012=00-13", "--fill", "7E0014-7E0014=00-1D"]
why = "the cursors anywhere in low RAM that a list can't run past: entries and lists can land on the cells and on each other. Kept to low RAM because the port diverges past $2000 (an accepted divergence, stated in game/scene/sprites.c)"

