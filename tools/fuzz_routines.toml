# The constraints each hand port is fuzzed with, for tools/fuzz_compare.py.
#
# A routine's `args` are ct_fuzz's own options after --routine (docs/PORTING.md,
# "Fuzzing"): --long for a routine entered by JSL, --interrupt for a handler,
# --keep/--fill/--range to keep random state inside what the game can produce,
# --d/--db for the direct page and data bank. `why` says what the constraints
# stand for; the entry's PORTING.md row records the counts. `iterations` is the
# default number of states (20000 when left out), which --iterations caps.
#
# A state is made once, with ct_dev --native off, from a movie and a frame
# count, and kept under traces/fuzz/ (gitignored: a save state is ROM-derived).

[state.attract]
movie = "oracle/movies/new-game.ctm"
frames = 300

[state.race]
movie = "oracle/movies/saves/events-jetbike-race.ctm"
frames = 6200

