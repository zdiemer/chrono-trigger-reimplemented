[[routine]]
name = "scene_load_sprite_list"
subsystem = "scene"
state = "attract"
args = ["--long", "--d", "0000", "--db", "00", "--fill", "7E0011-7E0012=00-00", "--fill", "7E0013-7E0013=00-00",
        "--fill", "7E0014-7E0014=09-09"]
why = "the cursor at the start of the sprite table, as each frame's first list finds it: the guard takes only a cursor whose sprites stay in the table (game/scene/sprites.c), so a list of up to 128 runs"

[[routine]]
name = "scene_load_sprite_list"
variant = "loose"
subsystem = "scene"
state = "attract"
args = ["--long", "--d", "0000", "--db", "00", "--fill", "7E0012-7E0012=00-01", "--fill", "7E0013-7E0013=00-1F",
        "--fill", "7E0014-7E0014=09-09", "--range", "A=0000-1FFF"]
why = "the cursor anywhere in the sprite table and the list anywhere in low RAM, so lists land on the table they are copied into; the guard (game/scene/sprites.c) refuses a cursor whose sprites would leave the table, which the original writes wherever it points (the scene's own cells, and the I/O registers past $2000), and a clipped list over the table"

