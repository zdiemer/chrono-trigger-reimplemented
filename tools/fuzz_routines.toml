# ---- battle ---------------------------------------------------------------------------------------
# The battle runs on its page (D = $0000) with the data bank at $7E; a combatant is named by its stat
# block's offset in X (0-$500 by $80) and, where the routine reads both, its battle slot in Y.

[state.battle]
movie = "oracle/movies/gato-battle.ctm"
frames = 20000

# -- the combatants and their timers (battle/combatants.c, battle/timers.c)

[[routine]]
name = "battle_update_low_hp_flag"
