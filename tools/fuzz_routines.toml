# ---- event: bank C0 (the event script's engine and command handlers) ---------------------------------
#
# The handlers run on the field's page (D = $0100) with the data bank $00; the
# running object ($016D) is a slot doubled, below $80 (its odd half is turned
# away by the guards, which accept only what the game makes: an object is an
# even offset); script offsets are kept in the first half of the buffer, since
# past $DFFF they reach bank $80, which mirrors low RAM. The loose variants let
# the offset run anywhere; the guards refuse a command whose operands could run
# past the buffer's end (event/engine.c, event_runs_here), which no script
# reaches, so those states show as skips. The entries are at their addresses:
# the rewrite renamed several.

[state.field]
movie = "oracle/movies/field.ctm"
frames = 11400

[[routine]]
name = "event_run_object_script"
at = "C0:5A93"
