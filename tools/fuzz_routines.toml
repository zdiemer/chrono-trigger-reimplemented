# ---- menu: bank C2 and the object commands of bank C6 ---------------------------------------------
#
# Two states: the menus proper (the field menu open, menus-field-menu) and the sprite-object
# mode (the Epoch's map screen, menus-epoch). The object mode's entries run on its page with a data
# bank of 0 and the running object a slot ($4E: $0B30 + $100 k); the script commands are entered as
# the interpreter's dispatch enters them (A and X the opcode doubled; the carry is random, and a
# state with it set is refused as the game never makes one) on a script built in work RAM at
# $7E:1C00, the opcode first and small operands after, so the cells they name are low RAM, with the
# sprite list kept from the state and the object's sprite script one the language reads. The
# entries are at their addresses: the rewrite renamed several.

[state.menus]
movie = "oracle/movies/saves/menus-field-menu.ctm"
frames = 3000

[state.objects]
movie = "oracle/movies/saves/menus-epoch.ctm"
frames = 8000

