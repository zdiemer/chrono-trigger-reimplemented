# ---- event: bank C0 (the event script's engine and command handlers) ---------------------------------
#
# The handlers run on the field's page (D = $0100) with the data bank $00; the
# running object ($016D) is a slot doubled, below $80 (its odd half is turned
# away by the guards, which accept only what the game makes: an object is an
# even offset); script offsets are kept in the first half of the buffer, since
# past $DFFF they reach bank $80, which mirrors low RAM. The loose variants let
# the offset run anywhere, so operands read through that mirror can land on the
# cells a command writes. The entries are at their addresses: the rewrite
# renamed several.

[state.field]
movie = "oracle/movies/field.ctm"
frames = 11400

[[routine]]
name = "event_run_object_script"
at = "C0:5A93"
subsystem = "event"
state = "field"
args = ["--d", "0100", "--db", "00", "--range", "Y=0000-7FFF", "--fill", "7E016D-7E016D=00-7F", "--fill", "7E016E-7E016E=00-00", "--range", "X=0000-007F"]
why = "the object in X (8-bit) a slot doubled below $80; each command runs as a call-out"

[[routine]]
name = "event_run_init_scripts"
at = "C0:58DE"
subsystem = "event"
state = "field"
args = ["--d", "0100", "--db", "00", "--range", "Y=0000-7FFF", "--fill", "7E016D-7E016D=00-7F", "--fill", "7E016E-7E016E=00-00", "--fill", "7F2000-7F2000=01-40"]
iterations = 2000
why = "up to 64 objects, each running its opening's commands as call-outs"

[[routine]]
name = "event_cmd_jump_forward"
at = "C0:62B5"
subsystem = "event"
state = "field"
args = ["--d", "0100", "--db", "00", "--range", "Y=0000-7FFF", "--fill", "7E016D-7E016D=00-7F", "--fill", "7E016E-7E016E=00-00"]
why = "the field's page and data bank, the running object a slot, the script offset below $8000"

[[routine]]
name = "event_cmd_jump_forward"
variant = "loose"
at = "C0:62B5"
subsystem = "event"
state = "field"
args = ["--d", "0100", "--db", "00", "--fill", "7E016D-7E016D=00-7F", "--fill", "7E016E-7E016E=00-00"]
why = "the script offset anywhere: operands past $DFFF are read through bank $80's mirror of low RAM"

[[routine]]
