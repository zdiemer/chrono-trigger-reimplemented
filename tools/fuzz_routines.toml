# ---- field: banks C0, C3 and FD (the field's own routines) -----------------------------------------
#
# The field's routines run on its page (D = $0100) or its layers' page
# ($1D00), with the data bank $00; objects are slots doubled, in X or in the
# current object ($016D). The rewrite's guards accept only those (an odd
# object is turned away, and counted in the skipped column), so the plain
# entries pin the page and the bank, and leave the rest random: pointers and
# cursors the routines follow land where they will, on the cells they write
# too, which is where a reordered access shows.

