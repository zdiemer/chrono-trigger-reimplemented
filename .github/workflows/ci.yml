name: CI

on:
  push:
    paths-ignore: ['**.md', 'docs/**', 'movies/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'movies/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc
            shell: bash
          - name: linux-clang
            os: ubuntu-latest
            cc: clang
            shell: bash
          - name: macos-clang
            os: macos-latest
            cc: clang
            shell: bash
          - name: windows-mingw-gcc
            os: windows-latest
            cc: gcc
            shell: msys2 {0}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libsdl2-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja sdl2
      - if: runner.os != 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
            mingw-w64-x86_64-SDL2

      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCT_WERROR=ON
      - name: Build native game and tests
        run: cmake --build build/ci -j 2
      - name: Native tests
        run: ctest --test-dir build/ci --output-on-failure --no-tests=error -j 2
      - name: ROM-free Python tests
        run: python3 -m unittest discover tests
