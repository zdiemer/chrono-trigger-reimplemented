name: CI

on:
  push:
    # Branches are checked by their pull request's run; a push run on main builds the player artifacts.
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'movies/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'movies/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc
            shell: bash
          - name: linux-clang
            os: ubuntu-latest
            cc: clang
            shell: bash
          - name: macos-clang
            os: macos-latest
            cc: clang
            shell: bash
          - name: windows-mingw-gcc
            os: windows-latest
            cc: gcc
            shell: msys2 {0}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libsdl2-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja sdl2
      - if: runner.os != 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
            mingw-w64-x86_64-SDL2

      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCT_WERROR=ON
      - name: Build native game and tests
        run: cmake --build build/ci -j 2
      - name: Native tests
        run: ctest --test-dir build/ci --output-on-failure --no-tests=error -j 2
      - name: ROM-free Python tests
        run: python3 -m unittest discover tests


  native-player:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    # A static name: a skipped job's name is never expanded. GitHub adds the matrix values to the jobs that run.
    name: native-player
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc, os: ubuntu-latest, cc: gcc, shell: bash }
          - { name: linux-clang, os: ubuntu-latest, cc: clang, shell: bash }
          - { name: macos-clang, os: macos-latest, cc: clang, shell: bash }
          - { name: windows-mingw-gcc, os: windows-latest, cc: gcc, shell: 'msys2 {0}' }
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libsdl2-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja sdl2
      - if: runner.os != 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
            mingw-w64-x86_64-SDL2

      - name: Configure native Release without a ROM
        run: >-
          cmake -S . -B build/player -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCT_WERROR=ON
      - name: Build native player
        run: cmake --build build/player --target ct_native -j 2
      - name: Package player and instructions
        run: python3 tools/package_native.py --build-dir build/player --output build/player-artifact
      - name: Smoke test packaged player
        run: build/player-artifact/ct_native --help
      - name: Upload native player
        uses: actions/upload-artifact@v4
        with:
          name: ct_native-${{ matrix.name }}-${{ runner.arch }}
          path: build/player-artifact/
          if-no-files-found: error
