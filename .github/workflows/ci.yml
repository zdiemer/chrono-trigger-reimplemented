name: CI

on:
  push:
    # Branches are checked by their pull request's run; a push run on main builds the player artifacts.
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'movies/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'movies/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc
            shell: bash
          - name: linux-clang
            os: ubuntu-latest
            cc: clang
            shell: bash
          # Without SDL2 ct_native is headless: this keeps that build and its tests compiling.
          - name: linux-gcc-headless
            os: ubuntu-latest
            cc: gcc
            shell: bash
            no_sdl: true
          - name: macos-clang
            os: macos-latest
            cc: clang
            shell: bash
          - name: windows-mingw-gcc
            os: windows-latest
            cc: gcc
            shell: msys2 {0}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build ${{ !matrix.no_sdl && 'libsdl2-dev' || '' }}
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja sdl2
      - if: runner.os != 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
            mingw-w64-x86_64-SDL2

      - name: Configure
        run: >-
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCT_WERROR=ON
          ${{ matrix.no_sdl && '-DCMAKE_DISABLE_FIND_PACKAGE_SDL2=ON -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON' || '' }}
      - name: Build native game and tests
        run: cmake --build build/ci -j 2
      - name: Native tests
        run: ctest --test-dir build/ci --output-on-failure --no-tests=error -j 2
      - name: ROM-free Python tests
        run: python3 -m unittest discover tests

  # The GBA program (targets/gba/), code only: no cartridge, so it is built and not played.
  gba:
    name: gba-arm-none-eabi
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the ARM toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Configure
        run: >-
          cmake -S targets/gba -B build/gba -G Ninja -DCT_WERROR=ON
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/targets/gba/toolchain.cmake
      - name: Build the GBA program
        run: cmake --build build/gba -j 2

  native-player:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    # A static name: a skipped job's name is never expanded. GitHub adds the matrix values to the jobs that run.
    name: native-player
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc, os: ubuntu-latest, cc: gcc, shell: bash }
          - { name: linux-clang, os: ubuntu-latest, cc: clang, shell: bash }
          - { name: macos-clang, os: macos-latest, cc: clang, shell: bash }
          - { name: windows-mingw-gcc, os: windows-latest, cc: gcc, shell: 'msys2 {0}' }
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libsdl2-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja sdl2
      - if: runner.os != 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
            mingw-w64-x86_64-SDL2

      - name: Configure native Release without a ROM
        run: >-
          cmake -S . -B build/player -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCT_WERROR=ON
      - name: Build native player
        run: cmake --build build/player --target ct_native -j 2
      - name: Package player and instructions
        run: python3 tools/package_native.py --build-dir build/player --output build/player-artifact
      - name: Smoke test packaged player
        run: build/player-artifact/ct_native --help
      # A machine that never built it: Debian 12 (glibc 2.36) with only the SDL2
      # runtime package, and macOS with Homebrew's SDL gone (the bundle carries it).
      - name: Run the packaged player on a clean Linux
        if: runner.os == 'Linux'
        run: >-
          docker run --rm -v "$PWD/build/player-artifact:/player:ro" debian:12-slim
          sh -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends libsdl2-2.0-0 > /dev/null
          && /player/ct_native --help'
      - name: Run the packaged player without Homebrew's SDL
        if: runner.os == 'macOS'
        timeout-minutes: 3   # a library that can't load SDL3 waits on a dialog
        run: |
          brew uninstall --ignore-dependencies --force sdl2-compat sdl3 sdl2 || true
          if ls "$(brew --prefix)"/lib/libSDL* 2> /dev/null; then echo "Homebrew's SDL is still installed"; exit 1; fi
          otool -L build/player-artifact/ct_native build/player-artifact/*.dylib
          build/player-artifact/ct_native --help
      - name: Upload native player
        uses: actions/upload-artifact@v4
        with:
          name: ct_native-${{ matrix.name }}-${{ runner.arch }}
          path: build/player-artifact/
          if-no-files-found: error
